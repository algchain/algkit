    userId: 'user_' + Math.random().toString(36).slice(2, 8),
    workspaceId: 'ws_' + Math.random().toString(36).slice(2, 8),
    cacheAvailable: false,
    networkLevel: 'offline',
    storageAvailable: false
  };

  // O: DOM element references (UI state)
  const $debug = document.getElementById('debug');
  const $capsList = document.getElementById('caps-list');
  const $tilesList = document.getElementById('tiles-list');
  const $slots = document.getElementById('slots');
  const $log = document.getElementById('log');
  const $dropZone = document.getElementById('drop-zone');
  const $loadSetSelect = document.getElementById('load-set-select');
  const $selfTestResult = document.getElementById('self-test-result');
  const $sessionName = document.getElementById('session-name');

  // Utilities
  function log(msg) {
    const ts = new Date().toISOString().slice(11, 23);
    $log.textContent += `[${ts}] ${msg}\n`;
    $log.scrollTop = $log.scrollHeight;
  }

  function detectCapabilities() {
    try {
      hubState.cacheAvailable = 'caches' in window && location.protocol !== 'file:';
    } catch {}
    if (navigator.onLine) hubState.networkLevel = 'internet';

    // PLATOKIT: Storage test
    const storageTest = PlatoKitStorage.test();
    hubState.storageAvailable = storageTest.pass;

    updateDebugUI();
    updateSelfTestUI(storageTest);
  }

  function updateDebugUI() {
    const yn = v => v ? '<span class="yes">yes</span>' : '<span class="no">no</span>';
    const popupsEnabled = PlatoKitParams.getAllowPopups();
    const sameOriginEnabled = PlatoKitParams.getAllowSameOrigin();
    $debug.innerHTML = `
      <span>cache: ${yn(hubState.cacheAvailable)}</span>
      <span>storage: ${yn(hubState.storageAvailable)}</span>
      <span>user: ${hubState.userId}</span>
      <span>workspace: ${hubState.workspaceId}</span>
      <span>network: <span class="${hubState.networkLevel === 'offline' ? 'no' : 'yes'}">${hubState.networkLevel}</span></span>
      <span>protocol: ${location.protocol}</span>
      ${popupsEnabled ? '<span class="warn">⚠️ POPUPS</span>' : ''}
      ${sameOriginEnabled ? '<span class="warn">⚠️ SAME-ORIGIN</span>' : ''}
    `;
  }

  // PLATOKIT: Self-test UI
  function updateSelfTestUI(result) {
    if (result.pass) {
      const persist = result.persistMsg ? ` | ${result.persistMsg}` : '';
      $selfTestResult.innerHTML = `<span class="pass">${result.msg}</span>${persist}`;
    } else {
      $selfTestResult.innerHTML = `<span class="fail">${result.msg}</span>`;
    }
  }

  // PLATOKIT: Populate load sets dropdown
  function populateLoadSets() {
    for (const name of Object.keys(LOAD_SETS)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name + ' (' + LOAD_SETS[name].length + ')';
      $loadSetSelect.appendChild(opt);
    }
  }

  function updateCapsUI() {
    const allCaps = new Set();
    const loadedTiles = [];

    for (const [id, s] of slots) {
      if (s.status === 'empty') continue;
      loadedTiles.push({ id, ...s });
      s.methods.forEach(m => allCaps.add(m));
    }

    $capsList.textContent = allCaps.size > 0 ? [...allCaps].join(', ') : '(none)';
    $capsList.style.color = allCaps.size > 0 ? '#ff0' : '#555';

    if (loadedTiles.length > 0) {
      $tilesList.innerHTML = loadedTiles.map(t => {
        const caps = t.methods.length ? ` [${t.methods.join(',')}]` : '';
        const statusColor = t.status === 'ready' ? '#0f0' : t.status === 'error' ? '#f44' : '#ff0';
        return `<span onclick="pingSlot(${t.id})" style="display:inline-block;background:#030;border:1px solid ${statusColor};padding:2px 6px;margin:2px;font-size:10px;cursor:pointer;color:${statusColor}">` +
          `Tile${t.id + 1}: ${t.type || '?'} ${t.source || ''}${caps}</span>`;
      }).join('');
    } else {
      $tilesList.innerHTML = '<span style="color:#555">(none)</span>';
    }
  }

  function updateTileTitle(id) {
    const s = slots.get(id);
    const $title = document.getElementById('title-' + id);
    if (!s || !$title) return;

    const typeStr = s.type || 'empty';
    const sourceStr = s.source || '';
    const capsStr = s.methods.length ? s.methods.join(', ') : '';
    const errorStr = s.errorMsg || '';

    $title.querySelector('.info').innerHTML =
      `<b>Tile ${id + 1}</b> ` +
      `<span class="type">${typeStr}</span>` +
      (sourceStr ? ` <span class="source">${sourceStr}</span>` : '') +
      (capsStr ? ` <span class="caps">[${capsStr}]</span>` : '') +
      (errorStr ? ` <span style="color:#f44">[${errorStr}]</span>` : '');

    const tile = document.getElementById('tile-' + id);
    tile.className = 'tile ' + (s.status || 'empty');
  }

  // Slot management
  function addSlot() {
    const id = nextSlotId++;
    slots.set(id, { source: null, type: null, methods: [], status: 'empty', inputValue: '', capturedSource: null, capName: null, capVersion: null });

    const div = document.createElement('div');
    div.className = 'tile';
    div.id = 'tile-' + id;
    div.innerHTML = `
      <div class="tile-title" id="title-${id}">
        <span class="info"><b>Tile ${id + 1}</b> <span class="type">(empty)</span></span>
        <button class="close" onclick="removeSlot(${id})">X</button>
      </div>
      <div class="tile-controls">
        <input class="tile-input" placeholder="URL / drop / paste" data-id="${id}">
        <button onclick="browseFile(${id})">File</button>
        <button onclick="loadSlot(${id})">Load</button>
        <button onclick="pingSlot(${id})">Ping</button>
        <input type="file" id="file-${id}" accept=".html,.htm" style="display:none" onchange="handleFileSelect(${id},this)">
      </div>
      <iframe id="frame-${id}" sandbox="allow-scripts${PlatoKitParams.getAllowModals() ? ' allow-modals' : ''}${PlatoKitParams.getAllowDownloads() ? ' allow-downloads' : ''}${PlatoKitParams.getAllowPopups() ? ' allow-popups allow-popups-to-escape-sandbox' : ''}${PlatoKitParams.getAllowSameOrigin() ? ' allow-same-origin' : ''}"></iframe>
    `;
    $slots.appendChild(div);
    setupInput(div.querySelector('.tile-input'), id);
    // Add drag listeners to iframe to catch drags that start over iframe
    const iframe = div.querySelector('iframe');
    if (iframe) {
      iframe.addEventListener('dragenter', e => {
        e.preventDefault();
        if (!dragOverlay) { createDragOverlay(); dragCounter = 1; }
      }, true);
      iframe.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragOverlay) { createDragOverlay(); dragCounter = 1; }
      }, true);
    }
    return id;
  }

  function setupInput(input, id) {
    // Track input value for state persistence
    input.oninput = () => {
      const s = slots.get(id);
      if (s) s.inputValue = input.value;
    };

    input.ondragover = e => { e.preventDefault(); input.classList.add('drag-over'); };
    input.ondragleave = () => input.classList.remove('drag-over');
    input.ondrop = e => {
      e.preventDefault();
      e.stopPropagation();
      input.classList.remove('drag-over');
      handleDrop(e, id);
    };
    input.onpaste = e => {
      const html = e.clipboardData.getData('text/html');
      const text = e.clipboardData.getData('text/plain');
      if (html && html.includes('<')) {
        e.preventDefault();
        loadContent(id, html, 'paste', 'html');
      } else if (text && text.includes('<')) {
        e.preventDefault();
        loadContent(id, text, 'paste', 'text');
      }
    };
    input.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadSlot(id);
      }
    };
  }

  function handleDrop(e, id) {
    // URL drop
    if (e.dataTransfer.items) {
      for (let item of e.dataTransfer.items) {
        if (item.type === 'text/uri-list') {
          item.getAsString(url => {
            const input = document.querySelector(`[data-id="${id}"]`);
            if (input) input.value = url;
            loadSlot(id);
          });
          return;
        }
      }
    }

    // File drop
    if (e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
        const reader = new FileReader();
        reader.onload = evt => loadContent(id, evt.target.result, 'file', file.name);
        reader.readAsText(file);
      }
    }
  }

  // GitHub URL rewriting (real GitHub + raw URLs + faux localhost for pre-push testing)
  function rewriteGithub(url) {
    // Real GitHub: blob → raw.githubusercontent.com
    const gh = url.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
    if (gh) {
      return {
        raw: `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/refs/heads/${gh[3]}/${gh[4]}`,
        name: gh[4].split('/').pop()
      };
    }
    // Already raw.githubusercontent.com — use as-is (can't iframe it, must fetch)
    const raw = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/(.+)$/);
    if (raw) {
      return {
        raw: url,
        name: raw[3].split('/').pop()
      };
    }
    // Faux local GitHub: localhost blob → localhost raw (for pre-push testing)
    const local = url.match(/^(http:\/\/localhost:\d+)\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
    if (local) {
      return {
        raw: `${local[1]}/${local[2]}/${local[3]}/raw/${local[4]}/${local[5]}`,
        name: local[5].split('/').pop()
      };
    }
    return null;
  }

  // Loading
  window.loadSlot = function(id) {
    const input = document.querySelector(`[data-id="${id}"]`);
    const val = input?.value.trim();
    if (!val) return;

    const frame = document.getElementById('frame-' + id);
    const s = slots.get(id);

    // Capture inputValue for state persistence (oninput doesn't fire on programmatic set)
    s.inputValue = val;

    // GitHub blob URL -> fetch raw
    const gh = rewriteGithub(val);
    if (gh) {
      log(`tile${id + 1}: fetching ${gh.name} from GitHub`);
      s.status = 'loading';
      s.type = 'github';
      s.source = gh.name;
      updateTileTitle(id);

      const isHtml = /\.html?$/i.test(gh.name);
      fetch(gh.raw)
        .then(r => r.ok ? r.text() : Promise.reject(r.status))
        .then(txt => {
          if (isHtml) {
            loadContent(id, txt, 'github', gh.name);
          } else {
            loadContent(id, `<pre style="margin:0;font-size:11px;background:#111;color:#0f0;overflow:auto">${txt.replace(/</g,'&lt;')}</pre>`, 'github', gh.name);
          }
        })
        .catch(e => {
          s.status = 'error';
          log(`tile${id + 1}: fetch failed (${e})`);
          updateTileTitle(id);
        });
      return;
    }

    // Inline HTML
    if (val.startsWith('<')) {
      loadContent(id, val, 'inline', 'html');
      return;
    }

    // URL or file path
    if (val.startsWith('http')) {
      s.type = 'url';
    } else if (val.startsWith('file:') || val.endsWith('.html') || val.endsWith('.htm')) {
      s.type = 'file';
    } else {
      s.type = 'url';
    }
    s.source = val.split('/').pop() || val;
    s.status = 'loading';
    s.errorMsg = null;  // Clear any previous error

    // For URL loads, try fetch first to check accessibility and show errors
    fetch(val, { mode: 'cors' })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(html => {
        log(`tile${id + 1}: fetched OK (${Math.round(html.length/1024)}KB)`);
        // Load via srcdoc instead of src to avoid mixed content issues
        loadContent(id, html, s.type, s.source);
      })
      .catch(err => {
        log(`tile${id + 1}: fetch FAILED - ${err.message}`);
        log(`tile${id + 1}: (mixed content? CORS? server down?)`);
        s.status = 'error';
        s.errorMsg = 'CORS/fetch failed';
        updateTileTitle(id);
        updateCapsUI();
      });

    log(`tile${id + 1}: loading ${s.type} ${s.source} (full: ${val})`);
    updateTileTitle(id);
    updateCapsUI();
    ensureEmptySlot(id);
  };

  // Sanitize HTML for safe srcdoc injection
  // Prevents closing-script-tags in cap source from breaking the parent page parser
  // This is a LOADER-LEVEL fix so caps don't need to worry about it
  function sanitizeForSrcdoc(html) {
    // Note: srcdoc itself handles this correctly, but we store capturedSource
    // which might be used in contexts where escaping matters
    return html;  // srcdoc handles escaping automatically
  }

  function loadContent(id, html, type, source) {
    const frame = document.getElementById('frame-' + id);
    const s = slots.get(id);
    s.type = type;
    s.source = source;
    s.status = 'loading';
    s.methods = [];
    s.capturedSource = html;  // Capture source for compilation (original, unescaped)

    frame.onload = () => {
      frameMap.set(frame.contentWindow, id);
      setTimeout(() => {
        if (s.status === 'loading') {
          s.status = 'ready';
          log(`tile${id + 1}: loaded (no registration)`);
          updateTileTitle(id);
          updateCapsUI();
        }
      }, 3000);
    };
    // Map source window BEFORE srcdoc navigation so early cap postMessage
    // (register/bus_subscribe) is not dropped as "unknown source".
    try {
      if (frame.contentWindow) frameMap.set(frame.contentWindow, id);
    } catch (_) {}
    frame.srcdoc = html;  // srcdoc attribute handles escaping automatically

    log(`tile${id + 1}: loading ${type} ${source}`);
    updateTileTitle(id);
    updateCapsUI();
    ensureEmptySlot(id);
  }

  // PLATOKIT: Load from base64
  function loadBase64(id, b64) {
    try {
      const html = atob(b64);
      loadContent(id, html, 'base64', 'inline');
      log(`tile${id + 1}: loaded from base64`);
    } catch (e) {
      log(`tile${id + 1}: base64 decode error: ${e.message}`);
    }
  }

  function ensureEmptySlot(usedId) {
    const lastTile = $slots.lastElementChild;
    if (lastTile && lastTile.id === 'tile-' + usedId) {
      addSlot();
    }
  }

  window.browseFile = function(id) {
    document.getElementById('file-' + id).click();
  };

  window.handleFileSelect = function(id, input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => loadContent(id, e.target.result, 'file', file.name);
    reader.readAsText(file);
  };

  window.removeSlot = function(id) {
    if (slots.size <= 1) {
      log(`tile${id + 1}: can't remove last slot`);
      return;
    }
    const tile = document.getElementById('tile-' + id);
    const frame = document.getElementById('frame-' + id);
    if (frame?.contentWindow) frameMap.delete(frame.contentWindow);
    tile?.remove();
    slots.delete(id);
    log(`tile${id + 1}: removed`);
    updateCapsUI();
  };

  window.pingSlot = function(id) {
    const s = slots.get(id);
    if (!s || s.status === 'empty') {
      log(`tile${id + 1}: not loaded`);
      return;
    }
    log(`tile${id + 1}: ping ->`);

    const frame = document.getElementById('frame-' + id);
    if (frame) {
      // Direct hub iframe
      frame.contentWindow.postMessage({ kind: 'ping', v: 1 }, '*');
    } else if (HubSkinService.isEnabled()) {
      // Skin-hosted cap
      const viewport = HubSkinService.getViewportForSlot(id);
      if (viewport) {
        HubSkinService.sendToSkin('cap_message', {
          viewport,
          message: { kind: 'ping', v: 1 }
        });
      }
    }
  };

  // CRITICAL: Prevent browser from navigating to dropped files
  // Use full-page overlay during drag to intercept all drops
  let dragCounter = 0;
  let lastDragEvent = 0;
  let dragOverlay = null;

  function createDragOverlay() {
    if (dragOverlay) return;
    dragOverlay = document.createElement('div');
    dragOverlay.id = 'drag-overlay';
    dragOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:rgba(0,255,0,0.1);pointer-events:auto;cursor:copy;';
    dragOverlay.ondragover = e => e.preventDefault();
    document.body.appendChild(dragOverlay);
  }

  function removeDragOverlay() {
    if (dragOverlay) {
      dragOverlay.remove();
      dragOverlay = null;
    }
    dragCounter = 0;
  }

  // Show overlay on drag start
  document.addEventListener('dragenter', e => {
    dragCounter++;
    if (dragCounter === 1) {
      createDragOverlay();
    }
  }, true);

  document.addEventListener('dragleave', e => {
    dragCounter--;
    if (dragCounter <= 0) {
      removeDragOverlay();
    }
  }, true);

  // Handle dragover - also create overlay as backup for quick drags
  document.addEventListener('dragover', e => {
    e.preventDefault();  // Required to allow drop
    lastDragEvent = Date.now();
    // Backup: create overlay if dragenter didn't fire (quick drags)
    if (!dragOverlay) {
      createDragOverlay();
      dragCounter = 1;
    }
  }, true);

  // Handle drop - find element under overlay
  document.addEventListener('drop', e => {
    e.preventDefault();  // Prevent browser from opening file
    e.stopPropagation(); // Stop any further handling

    // Get the actual element under the drop point (hide overlay temporarily)
    if (dragOverlay) dragOverlay.style.display = 'none';
    const realTarget = document.elementFromPoint(e.clientX, e.clientY);
    if (dragOverlay) dragOverlay.style.display = '';

    removeDragOverlay();

    // Route to appropriate handler based on real target
    const tile = realTarget?.closest('.tile');
    const tileInput = realTarget?.closest('.tile-input');
    const dropZone = realTarget?.closest('#drop-zone');
    const iframe = realTarget?.tagName === 'IFRAME' ? realTarget : null;

    if (tileInput) {
      // Dropped on input field - extract tile ID and handle
      const id = parseInt(tileInput.dataset.id, 10);
      if (!isNaN(id)) handleDrop(e, id);
      return;
    }

    if (iframe) {
      // Dropped on iframe - find parent tile
      const parentTile = iframe.closest('.tile');
      if (parentTile) {
        const tileId = parentTile.id?.replace('tile-', '');
        const id = parseInt(tileId, 10);
        if (!isNaN(id)) {
          handleDrop(e, id);
          return;
        }
      }
    }

    if (tile) {
      // Dropped anywhere within tile (green box) - extract tile ID
      const tileId = tile.id?.replace('tile-', '');
      const id = parseInt(tileId, 10);
      if (!isNaN(id)) {
        handleDrop(e, id);
        return;
      }
    }

    if (dropZone) {
      // Dropped on global drop zone - find empty slot
      handleGlobalDrop(e);
      return;
    }

    // Dropped elsewhere on page - find empty slot
    handleGlobalDrop(e);
  }, true);  // capture phase

  // Fallback: reset drag state on mousemove if stuck
  document.addEventListener('mousemove', () => {
    if (dragCounter !== 0 && Date.now() - lastDragEvent > 200) {
      removeDragOverlay();
    }
  });

  // Fallback: reset on click if overlay got stuck
  document.addEventListener('click', () => {
    if (dragCounter !== 0) removeDragOverlay();
  }, true);

  // Visual drop zone
  $dropZone.ondragover = e => {
    e.preventDefault();
    $dropZone.classList.add('active');
  };
  $dropZone.ondragleave = () => $dropZone.classList.remove('active');
  $dropZone.ondrop = e => {
    e.preventDefault();
    e.stopPropagation();
    $dropZone.classList.remove('active');
    handleGlobalDrop(e);
  };

  function handleGlobalDrop(e) {
    let targetId = null;
    for (const [id, s] of slots) {
      if (s.status === 'empty') { targetId = id; break; }
    }
    if (targetId === null) targetId = addSlot();
    handleDrop(e, targetId);
  }

  // ==========================================================================
  // OAC: TRANSFORM KERNEL (Workspace.K - Execution Dispatcher)
  // --------------------------------------------------------------------------
  // This is the heart of the CCM Matrix - the kernel that receives OAC
  // transform requests and dispatches to the appropriate algorithm under
  // constraints.
  //
  // Each incoming message is: { kind, v, id, payload }
  //   - kind: A identifier (which algorithm to invoke)
  //   - v: C (protocol version constraint)
  //   - id: Correlation ID (for O' → requester routing)
  //   - payload: O (the object to transform)
  //
  // The switch statement is the INSTRUCTION DECODER - each case is a valid
  // transform path. Unknown kind = invalid instruction = no transform.
  //
  // Classical: Command Pattern, Router Pattern, Message Dispatcher
  // ==========================================================================
  window.onmessage = e => {
    const d = e.data;               // O: Incoming message object
    if (!d || !d.kind) return;      // C: Must have kind (protocol constraint)

    // TRANSFORM PATH: Tab Relay Response (from opened tabs, not iframes)
    // OAC: O = relay payload, A = handleTabRelay, C = request_id correlation
    // Must check BEFORE frameMap lookup since tabs aren't tracked iframes
    if (d.kind === 'tab_relay') {
      const relayRequestId = d.request_id;
      const relayPayload = d.payload;
      if (relayRequestId) {
        const relayResult = HubTabRelayService.handleTabRelay(relayRequestId, relayPayload);
        log(`hub: <- tab_relay(${relayRequestId}) -> ${relayResult.success ? 'routed' : relayResult.error}`);
      }
      return;
    }

    // TRANSFORM PATH: Load Compiled Cap (from compiled workspace wrapper)
    // OAC: O = embedded cap HTML, A = loadContent, C = trusted (compiled source)
    // Must check BEFORE frameMap since it comes from parent (compiled wrapper), not cap iframe
    if (d.kind === 'load_compiled_cap') {
      const compiledSlot = d.slot ?? findEmptySlot();
      if (d.html) {
        log(`hub: <- load_compiled_cap slot=${compiledSlot} name=${d.registration?.name || '?'}`);
        loadContent(compiledSlot, d.html, 'compiled', d.registration?.name || 'compiled');
        // Restore registration info if provided
        const cs = slots.get(compiledSlot);
        if (cs && d.registration) {
          cs.capName = d.registration.name;
          cs.capVersion = d.registration.version;
        }
      }
      return;
    }

    // TRANSFORM PATH: Restore Storage (from compiled workspace wrapper)
    // OAC: O = storage snapshot, A = restore, C = trusted (compiled source)
    // Must check BEFORE frameMap since it comes from parent (compiled wrapper)
    if (d.kind === 'restore_storage') {
      if (d.storage && typeof d.storage === 'object') {
        const keys = Object.keys(d.storage);
        log(`hub: <- restore_storage (${keys.length} keys)`);
        keys.forEach(key => {
          PlatoKitStorage.set(key, d.storage[key]);
        });
      }
      return;
    }

    // TRANSFORM PATH: Hub Source Request (for compilation)
    // OAC: O = hub HTML source, A = fetch self, C = requestor is known iframe
    if (d.kind === 'hub_source_request') {
      const reqSource = e.source;
      const reqId = d.id;
      const reqSlotId = frameMap.get(reqSource);
      const slotLabel = reqSlotId !== undefined ? `tile${reqSlotId + 1}` : 'unknown';

      log(`${slotLabel}: <- hub_source_request`);

      // Helper: serialize DOM as fallback (works on file:// where fetch is blocked)
      const serializeDOM = () => {
        const doctype = document.doctype ?
          `<!DOCTYPE ${document.doctype.name}${document.doctype.publicId ? ` PUBLIC "${document.doctype.publicId}"` : ''}${document.doctype.systemId ? ` "${document.doctype.systemId}"` : ''}>` :
          '<!DOCTYPE html>';
        return doctype + '\n' + document.documentElement.outerHTML;
      };

      // Check if we're on file:// protocol (fetch will fail due to CORS)
      if (location.protocol === 'file:' || location.origin === 'null') {
        log(`${slotLabel}: file:// protocol detected, using DOM serialization`);
        const html = serializeDOM();
        log(`${slotLabel}: -> hub_source_response (${html.length} bytes, DOM)`);
        reqSource.postMessage({
          kind: 'hub_source_response',
          v: 1,
          id: reqId,
          payload: { html, fromDOM: true }
        }, '*');
        return;
      }

      // HTTP/HTTPS: fetch our own source file
      fetch('platokit.html')
        .then(r => r.ok ? r.text() : Promise.reject('HTTP ' + r.status))
        .then(html => {
          log(`${slotLabel}: -> hub_source_response (${html.length} bytes, fetched)`);
          reqSource.postMessage({
            kind: 'hub_source_response',
            v: 1,
            id: reqId,
            payload: { html }
          }, '*');
        })
        .catch(err => {
          // Fallback to DOM serialization
          log(`${slotLabel}: fetch failed (${err}), using DOM fallback`);
          const html = serializeDOM();
          log(`${slotLabel}: -> hub_source_response (${html.length} bytes, DOM fallback)`);
          reqSource.postMessage({
            kind: 'hub_source_response',
            v: 1,
            id: reqId,
            payload: { html, fromDOM: true }
          }, '*');
        });

      return;
    }

    // TRANSFORM PATH: Skin Action (from skin iframe)
    // OAC: O = action payload, A = handleAction, C = must be from skin frame
    // Skin sends user actions to hub for processing
    if (d.kind === 'skin_action') {
      if (HubSkinService.isEnabled() && e.source === HubSkinService.getFrame()?.contentWindow) {
        HubSkinService.handleAction(d.payload || {}, e.source);
      }
      return;
    }

    // TRANSFORM PATH: Skin Relay (legacy/fallback - main path is via skin_action)
    // Kept for backwards compatibility if skin sends kind:'skin_relay' directly
    if (d.kind === 'skin_relay' && d.innerMessage) {
      HubSkinService.handleCapRelay(d.viewport, d.innerMessage);
      return;
    }

    // TRANSFORM PATH: Workspace State Request (from export UI or other caps)
    // OAC: O = workspace state, A = getWorkspaceState, C = requestor is known iframe
    // This allows sandboxed caps to request state without direct parent access
    if (d.kind === 'workspace_state_request') {
      const reqSource = e.source;
      const reqId = d.id;
      const reqOptions = d.options || {};

      // Get the slot ID for logging (if from known iframe)
      const reqSlotId = frameMap.get(reqSource);
      const slotLabel = reqSlotId !== undefined ? `tile${reqSlotId + 1}` : 'unknown';

      log(`${slotLabel}: <- workspace_state_request`);

      // Async: get state and respond
      HubStateService.getWorkspaceState({
        includeStorage: reqOptions.includeStorage !== false,
        includeSources: reqOptions.includeSources !== false,
        includeCapStates: reqOptions.includeCapStates !== false,
        fetchMissingSources: reqOptions.fetchMissingSources !== false
      }).then(state => {
        log(`${slotLabel}: -> workspace_state_response (${state.slots.length} slots)`);
        reqSource.postMessage({
          kind: 'workspace_state_response',
          v: 1,
          id: reqId,
          payload: state
        }, '*');
      }).catch(err => {
        log(`${slotLabel}: -> workspace_state_response error: ${err.message}`);
        reqSource.postMessage({
          kind: 'workspace_state_response',
          v: 1,
          id: reqId,
          payload: null,
          error: err.message
        }, '*');
      });

      return;
    }

    // C: Identity constraint - message must come from known source
    let id = frameMap.get(e.source);
    if (id === undefined) {
      // Recover mapping if message arrived before frameMap population.
      for (const [slotId] of slots) {
        const frame = document.getElementById('frame-' + slotId);
        if (frame?.contentWindow === e.source) {
          id = slotId;
          frameMap.set(e.source, slotId);
          break;
        }
      }
    }
    if (id === undefined) return;     // Unknown source = rejected

    // O: Get capability state for this slot
    const s = slots.get(id);
    if (!s) return;

    // INSTRUCTION DECODER: Route to algorithm based on kind
    switch (d.kind) {

      // TRANSFORM PATH: Register
      // OAC: O = cap profile, A = register, C = valid payload
      // Cap declares its OAC profile to the workspace
      case 'register':
        s.methods = d.payload?.methods || d.methods || [];  // O' = methods updated
        s.capName = d.payload?.name || d.name || null;      // O' = name captured
        s.capVersion = d.payload?.version || d.version || null;  // O' = version captured
        s.status = 'ready';
        log(`tile${id + 1}: <- register ${s.capName || '?'}@${s.capVersion || '?'} [${s.methods.join(',')}]`);

        e.source.postMessage({
          kind: 'registered',
          v: 1,
          payload: { success: true, name: s.capName || `tile${id + 1}`, hubId: hubState.workspaceId }
        }, '*');

        updateTileTitle(id);
        updateCapsUI();
        break;

      // TRANSFORM PATH: Pong (health check response)
      // OAC: O = ack, A = log, C = none
      case 'pong':
        log(`tile${id + 1}: <- pong`);
        break;

      // TRANSFORM PATH: Ready signal
      // OAC: O = status, A = mark ready, C = none
      case 'ready':
      case 'iframe_ready':
        s.status = 'ready';                     // O' = status updated
        log(`tile${id + 1}: <- ready`);
        updateTileTitle(id);
        updateCapsUI();
        break;

      // TRANSFORM PATH: Generic response
      // OAC: O = result, A = log, C = none
      case 'response':
        log(`tile${id + 1}: <- response: ${JSON.stringify(d.payload?.result || d.result)}`);
        break;

      // TRANSFORM PATH: Error report
      // OAC: O = error info, A = log, C = none
      case 'error':
        log(`tile${id + 1}: <- error: ${d.payload?.message || d.error?.message || 'unknown'}`);
        break;

      // TRANSFORM PATH: State Response (from cap)
      // OAC: O = cap state, A = handleStateResponse, C = pending query exists
      case 'state_response':
        if (d.id && HubStateService.handleStateResponse(d.id, d.payload || {})) {
          log(`tile${id + 1}: <- state_response`);
        }
        break;

      // TRANSFORM PATH: Storage Operation
      // OAC: O = key/value, A = store op (get/set/append/remove/list/clear), C = STORE_PREFIX
      case 'store':
        const storePayload = d.payload || {};
        const storeResult = HubStoreService.handle(
          storePayload.op,
          storePayload.key,
          storePayload.value
        );
        log(`tile${id + 1}: <- store.${storePayload.op}(${storePayload.key}) -> ${storeResult.error || 'ok'}`);

        // Send response back to requesting cap
        e.source.postMessage({
          kind: 'store_response',
          v: 1,
          id: d.id,
          payload: storeResult
        }, '*');
        break;

      // TRANSFORM PATH: HTTP Fetch
      // OAC: O = request/response, A = fetch, C = ALLOWED_METHODS, CORS
      case 'http':
        const httpPayload = d.payload || {};
        const httpSource = e.source;
        const httpId = d.id;

        log(`tile${id + 1}: <- http.${httpPayload.method || 'GET'} ${httpPayload.url || '?'}`);

        // A: Execute async HTTP transform
        // O' = fetch response, C applied inside HubHttpService.handle
        HubHttpService.handle(httpPayload).then(httpResult => {
          log(`tile${id + 1}: -> http ${httpResult.status || 'err'} ${httpResult.error || ''}`);
          httpSource.postMessage({
            kind: 'http_response',
            v: 1,
            id: httpId,
            payload: httpResult          // O' returned to requester
          }, '*');
        });
        break;

      // TRANSFORM PATH: Service Discovery
      // OAC: O = SERVICES registry, A = getCapabilities, C = read-only
      case 'capabilities':
        const capsResult = HubCapabilitiesService.getCapabilities();
        log(`tile${id + 1}: <- capabilities (${capsResult.services.length} services)`);

        e.source.postMessage({
          kind: 'capabilities_response',
          v: 1,
          id: d.id,
          payload: capsResult
        }, '*');
        break;

      // TRANSFORM PATH: Event Bus Subscribe
      // OAC: O = subscriptions map, A = subscribe, C = topic validation
      case 'bus_subscribe':
        const subTopic = d.payload?.topic;
        if (subTopic) {
          const subResult = HubEventBusService.subscribe(e.source, id, subTopic);
          log(`tile${id + 1}: <- bus_subscribe(${subTopic})`);
          e.source.postMessage({
            kind: 'bus_subscribe_response',
            v: 1,
            id: d.id,
            payload: subResult
          }, '*');
        }
        break;

      // TRANSFORM PATH: Event Bus Unsubscribe
      // OAC: O = subscriptions map, A = unsubscribe, C = must be subscribed
      case 'bus_unsubscribe':
        const unsubTopic = d.payload?.topic;
        if (unsubTopic) {
          const unsubResult = HubEventBusService.unsubscribe(e.source, id, unsubTopic);
          log(`tile${id + 1}: <- bus_unsubscribe(${unsubTopic})`);
          e.source.postMessage({
            kind: 'bus_unsubscribe_response',
            v: 1,
            id: d.id,
            payload: unsubResult
          }, '*');
        }
        break;

      // TRANSFORM PATH: Event Bus Publish
      // OAC: O = event data, A = publish (distribute to subscribers), C = topic matching
      case 'bus_publish':
        const pubTopic = d.payload?.topic;
        const pubData = d.payload?.data;
        if (pubTopic) {
          // A: Distribute O to all subscribers of topic | C(subscribed)
          const pubResult = HubEventBusService.publish(id, pubTopic, pubData);
          log(`tile${id + 1}: <- bus_publish(${pubTopic}) -> ${pubResult.delivered} delivered`);
        }
        break;

      // TRANSFORM PATH: Event Bus Broadcast
      // OAC: O = event data, A = broadcast (distribute to ALL), C = none
      case 'bus_broadcast':
        const bcastData = d.payload?.data;
        const bcastResult = HubEventBusService.broadcast(id, bcastData);
        log(`tile${id + 1}: <- bus_broadcast -> ${bcastResult.delivered} delivered`);
        break;

      // TRANSFORM PATH: Event Bus List Topics
      // OAC: O = topic registry, A = listTopics, C = read-only
      case 'bus_list_topics':
        const topicsList = HubEventBusService.listTopics();
        log(`tile${id + 1}: <- bus_list_topics (${topicsList.length} topics)`);
        e.source.postMessage({
          kind: 'bus_list_topics_response',
          v: 1,
          id: d.id,
          payload: { topics: topicsList }
        }, '*');
        break;

      // TRANSFORM PATH: Load Base64 Content
      // OAC: O = base64 HTML, A = decode + loadContent, C = valid base64
      case 'load_base64':
        const targetSlot = d.payload?.slot ?? findEmptySlot();
        if (targetSlot !== null && d.payload?.b64) {
          loadBase64(targetSlot, d.payload.b64);
        }
        break;

      // TRANSFORM PATH: Tab Relay Open
      // OAC: O = URL + request_id, A = openTab, C = ALLOWED_URLS whitelist (SECURITY)
      // This is a PRIVILEGE ESCALATION - crossing from sandbox to unsandboxed zone
      case 'open_tab':
        const tabUrl = d.payload?.url;
        const tabRequestId = d.id || ('tab_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
        if (tabUrl) {
          // A: Open tab | C(whitelist) - constraint checked inside service
          const tabResult = HubTabRelayService.openTab(e.source, id, tabRequestId, tabUrl, d.payload);
          log(`tile${id + 1}: <- open_tab(${tabUrl}) -> ${tabResult.success ? 'opened' : tabResult.error}`);
          e.source.postMessage({
            kind: 'open_tab_response',
            v: 1,
            id: tabRequestId,
            payload: tabResult
          }, '*');
        }
        break;

      // TRANSFORM PATH: Cap-to-Hub Spawn Request
      // OAC: O = cap URL or load_set name, A = addSlot + loadSlot (or PlatoKit.loadSet), C = valid URL/set name
      // Allows a child cap (e.g. searcher) to request the hub to load another cap or set of caps
      case 'spawn_cap':
        const spawnUrl = d.payload?.url;
        const spawnSetName = d.payload?.load_set;
        const spawnRequestId = d.id || ('spawn_' + Date.now());
        if (spawnSetName && LOAD_SETS[spawnSetName]) {
          // Load an entire set of caps
          PlatoKit.loadSet(spawnSetName);
          log(`tile${id + 1}: <- spawn_cap(load_set=${spawnSetName})`);
          e.source.postMessage({
            kind: 'spawn_cap_response', v: 1, id: spawnRequestId,
            payload: { success: true, load_set: spawnSetName }
          }, '*');
        } else if (spawnUrl) {
          // Load a single cap - reuse empty slot if available
          const spawnSlotId = findEmptySlot();
          const spawnInput = document.querySelector(`[data-id="${spawnSlotId}"]`);
          if (spawnInput) {
            spawnInput.value = spawnUrl;
            loadSlot(spawnSlotId);
          }
          log(`tile${id + 1}: <- spawn_cap(${spawnUrl}) -> slot ${spawnSlotId + 1}`);
          e.source.postMessage({
            kind: 'spawn_cap_response', v: 1, id: spawnRequestId,
            payload: { success: true, slotId: spawnSlotId, url: spawnUrl }
          }, '*');
        } else {
          log(`tile${id + 1}: <- spawn_cap (no url or load_set)`);
          e.source.postMessage({
            kind: 'spawn_cap_response', v: 1, id: spawnRequestId,
            payload: { success: false, error: 'missing url or load_set' }
          }, '*');
        }
        break;

      // DEFAULT: Unknown instruction (no valid transform path)
      default:
        log(`tile${id + 1}: <- ${d.kind}`);
    }
  };
  // END TRANSFORM KERNEL
  // ==========================================================================

  function findEmptySlot() {
    for (const [id, s] of slots) {
      if (s.status === 'empty') return id;
    }
    return addSlot();
  }


  // ==========================================================================
  // OAC: DEBUG INTERFACE (Workspace.Debug - Development Algorithms)
  // --------------------------------------------------------------------------
  // Exposes workspace internals for debugging and manual transforms.
  // All algorithm banks are accessible via PlatoKit.* in browser console.
  //
  // Classical: Facade Pattern, Debug Interface
  // ==========================================================================
  window.PlatoKit = {
    // Load a set by name
    loadSelectedSet: function() {
      const setName = $loadSetSelect.value;
      if (!setName || !LOAD_SETS[setName]) {
        log('platokit: no load set selected');
        return;
      }
      this.loadSet(setName);
    },

    loadSet: function(setName) {
      const tiles = LOAD_SETS[setName];
      if (!tiles) {
        log('platokit: unknown load set: ' + setName);
        return;
      }
      log('platokit: loading set "' + setName + '" (' + tiles.length + ' tiles)');

      tiles.forEach((path, i) => {
        // Find or create slot
        let targetId = null;
        for (const [id, s] of slots) {
          if (s.status === 'empty') { targetId = id; break; }
        }
        if (targetId === null) targetId = addSlot();

        // Set input and load
        const input = document.querySelector(`[data-id="${targetId}"]`);
        if (input) {
          input.value = path;
          loadSlot(targetId);
        }
      });
    },

    // Reload all loaded tiles
    reloadAll: function() {
      log('platokit: reloading all tiles');
      for (const [id, s] of slots) {
        if (s.status !== 'empty' && s.inputValue) {
          const input = document.querySelector(`[data-id="${id}"]`);
          if (input) {
            input.value = s.inputValue;
            loadSlot(id);
          }
        }
      }
    },

    // Save current state to session
    saveSession: function() {
      const name = $sessionName.value.trim() || 'default';
      const state = this.getState();

      if (PlatoKitStorage.saveSession(name, state)) {
        log('platokit: session saved: ' + name);
      } else {
        log('platokit: session save failed (storage unavailable)');
      }
    },

    // Load session by name
    loadSession: function() {
      const name = $sessionName.value.trim() || 'default';
      const state = PlatoKitStorage.getSession(name);

      if (!state) {
        log('platokit: session not found: ' + name);
        return;
      }

      log('platokit: loading session: ' + name);
      this.restoreState(state);
    },

    // Get current state as object
    getState: function() {
      const tilesState = [];
      for (const [id, s] of slots) {
        if (s.status !== 'empty') {
          tilesState.push({
            inputValue: s.inputValue || s.source,
            type: s.type,
            source: s.source
          });
        }
      }
      return {
        version: 1,
        tiles: tilesState,
        timestamp: new Date().toISOString()
      };
    },

    // Restore state from object
    restoreState: function(state) {
      if (!state || !state.tiles) return;

      state.tiles.forEach((t, i) => {
        let targetId = null;
        for (const [id, s] of slots) {
          if (s.status === 'empty') { targetId = id; break; }
        }
        if (targetId === null) targetId = addSlot();

        const input = document.querySelector(`[data-id="${targetId}"]`);
        if (input && t.inputValue) {
          input.value = t.inputValue;
          loadSlot(targetId);
        }
      });
    },

    // Copy deep link to clipboard
    copyDeepLink: function() {
      const state = this.getState();
      const tiles = state.tiles.map(t => t.inputValue).filter(Boolean);

      const url = PlatoKitParams.build({ tiles });

      navigator.clipboard.writeText(url).then(() => {
        log('platokit: deep link copied to clipboard');
      }).catch(() => {
        log('platokit: deep link: ' + url);
      });
    },

    // Load from base64 param
    loadBase64Param: function(b64) {
      const id = findEmptySlot();
      loadBase64(id, b64);
    },

    // Expose modules for debugging
    Storage: PlatoKitStorage,
    Params: PlatoKitParams,
    StoreService: HubStoreService,
    HttpService: HubHttpService,
    Capabilities: HubCapabilitiesService,
    EventBus: HubEventBusService,
    TabRelay: HubTabRelayService,
    StateService: HubStateService,
    Skin: HubSkinService,
    LOAD_SETS: LOAD_SETS,
    SKIN_LOAD_SETS: HubSkinService.SKIN_LOAD_SETS,

    // State export shortcuts
    exportState: async function(options) {
      log('platokit: exporting workspace state...');
      const state = await HubStateService.getWorkspaceState(options);
      log(`platokit: exported ${state.slots.length} slots, ${Object.keys(state.hubState.storageSnapshot || {}).length} storage keys`);
      return state;
    },

    exportJson: async function(options) {
      const json = await HubStateService.exportToJson(options);
      log(`platokit: exported ${json.length} bytes JSON`);
      return json;
    },

    downloadState: async function(filename, options) {
      const json = await HubStateService.exportToJson(options);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || `workspace_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      log(`platokit: downloaded ${a.download}`);
    }
  };
  // ==========================================================================


  // ==========================================================================
  // OAC: AUTO-INITIALIZATION (Workspace Boot Sequence)
  // --------------------------------------------------------------------------
  // Reads URL params and auto-loads capabilities on workspace startup.
  // This is the "boot loader" - initializing the CCM Matrix from config.
  //
  // Classical: Bootstrap Pattern, Configuration Loading
  // ==========================================================================
  function autoInit() {
    // Check for ?skin=true - spawn skin overlay
    if (PlatoKitParams.getSkinMode()) {
      log('platokit: skin mode enabled');
      HubSkinService.spawn();
      // Still continue to load caps below - they'll be available to skin
    }

    // Check for ?load_set=
    const loadSet = PlatoKitParams.getLoadSet();
    if (loadSet) {
      // Skin-aware routing: prefer SKIN_LOAD_SETS when skin is active
      if (PlatoKitParams.getSkinMode() && HubSkinService.SKIN_LOAD_SETS[loadSet]) {
        log('platokit: routing load_set through skin: ' + loadSet);
        // Wait for skin ready, then load the set via skin-aware path
        const waitAndLoad = () => {
          if (HubSkinService.isReady()) {
            HubSkinService.loadSetForSkin(loadSet);
          } else {
            setTimeout(waitAndLoad, 150);
          }
        };
        setTimeout(waitAndLoad, 200);
        return;
      }
      // Fallback: legacy load set (non-skin or no SKIN_LOAD_SET match)
      if (LOAD_SETS[loadSet]) {
        log('platokit: auto-loading set from URL: ' + loadSet);
        $loadSetSelect.value = loadSet;
        setTimeout(() => PlatoKit.loadSet(loadSet), 100);
        return;
      }
      log('platokit: unknown load_set: ' + loadSet);
    }

    // Check for ?tiles=
    const tiles = PlatoKitParams.getTiles();
    if (tiles.length > 0) {
      log('platokit: auto-loading tiles from URL: ' + tiles.join(', '));
      tiles.forEach((path, i) => {
        setTimeout(() => {
          let targetId = null;
          for (const [id, s] of slots) {
            if (s.status === 'empty') { targetId = id; break; }
          }
          if (targetId === null) targetId = addSlot();

          const input = document.querySelector(`[data-id="${targetId}"]`);
          if (input) {
            input.value = path;
            loadSlot(targetId);
          }
        }, i * 50);
      });
      return;
    }

    // Check for ?iframe_src_base64=
    const b64 = PlatoKitParams.getBase64Iframe();
    if (b64) {
      log('platokit: auto-loading from base64 param');
      setTimeout(() => PlatoKit.loadBase64Param(b64), 100);
      return;
    }

    // Check for ?restore=
    const restore = PlatoKitParams.getRestore();
    if (restore) {
      log('platokit: auto-restoring session: ' + restore);
      $sessionName.value = restore;
      setTimeout(() => PlatoKit.loadSession(), 100);
      return;
    }
  }

    if (ch) {
      ch.onclick = function() {
        try { navigator.clipboard.writeText('python start_server.py'); ch.style.color = '#0f0'; setTimeout(function() { ch.style.color = '#888'; }, 1000); } catch (_) {}
      };
    }
  })();
  // Server probe: check if local HTTP server is reachable
  (function() {
    var $ss = document.getElementById('server-status');
    var $sh = document.getElementById('server-hint');
    if (!$ss) return;
    fetch(HUB_SERVER + '/', { method: 'HEAD', mode: 'no-cors' })
      .then(function() { $ss.textContent = HUB_SERVER + ' online'; $ss.style.color = '#0f0'; })
      .catch(function() { $ss.textContent = 'offline'; $ss.style.color = '#f44'; if ($sh) $sh.style.display = 'inline'; });
  })();
  log('platokit ready');          // Workspace online
  addSlot();                  // Create first capability slot

  // Boot: auto-load from URL params after DOM ready
  setTimeout(autoInit, 50);

})();

// END CCM MATRIX WORKSPACE

</script>
