<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlatoKit: Exit — collar</title>
  <!-- Embeddable by the host-page div. NO frame-ancestors restriction here.
       child-src widened from 'self' to also allow:
         - http://localhost:*, http://127.0.0.1:* — local-dev test uapps
         - https:                                  — any TLS-protected uapp
         - blob:                                   — pasted-HTML uapps
       The collar still mediates every iv and gates `ua` (registry admin)
       to admin-scoped uapps only — see plan_uadd.md §5. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; child-src 'self' http://localhost:* http://127.0.0.1:* https: blob:; connect-src 'none';">
  <meta name="referrer" content="no-referrer">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:#fcfcff;font:12px/1.4 system-ui,sans-serif;color:#333}
    body{padding:6px 6px 0;display:flex;flex-direction:column;gap:0}
    /* Tab strip — micro-app selection reads as nav. Active tab gets a
     * coloured underline that joins the strip's bottom border. Hidden
     * tabs are muted; the chrome around them is invisible so the panel
     * feels like a single workbench, not a row of buttons. */
    #uapps{display:flex;gap:2px;border-bottom:1px solid #d8dde6;flex-wrap:wrap}
    #uapps button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;color:#666;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.2px}
    #uapps button:hover{color:#036}
    #uapps button.active{color:#036;font-weight:600;border-bottom-color:#1a73e8}
    #frame-host{flex:1;min-height:120px;display:flex;padding-top:6px}
    /* No border on the uapp iframe — the tab strip provides all the
     * structure; a frame line just adds visual noise. */
    #frame-host iframe{flex:1;width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <div id="uapps"></div>
  <div id="frame-host"></div>
  <!-- Relative path: resolves to <HUB-base>/collar.js. Works for dev
       (http://localhost:8099/collar.js) AND production GH Pages
       (https://algchain.github.io/algkit/bookmarks/v1/collar.js). -->
  <script src="collar.js"></script>
</body>
</html>
